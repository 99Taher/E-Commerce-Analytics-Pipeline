dbt_retail:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'retail_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'retail_pass_2024') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'retail_dw') }}"
      schema: staging
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
