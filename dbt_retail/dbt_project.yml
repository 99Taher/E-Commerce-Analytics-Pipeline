name: 'dbt_retail'
version: '1.0.0'
config-version: 2

profile: 'dbt_retail'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_retail:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: warehouse
      +materialized: table
    analytics:
      +schema: warehouse
      +materialized: view
